<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스윗밸런스 테스트 페이지</title>
  <style>
    :root {
      --bg: #fdfcfa;
      --fg: #1f2933;
      --muted: #6b7280;
      --accent: #e8734a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171c;
        --fg: #f3f4f6;
        --muted: #9ca3af;
        --accent: #ff9066;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      background: var(--bg);
      color: var(--fg);
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Malgun Gothic", "Noto Sans KR", sans-serif;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 5vw, 2.4rem);
      font-weight: 700;
      line-height: 1.4;
      word-break: keep-all;
    }
    h1 .accent { color: var(--accent); }
    #today {
      margin: 0;
      font-size: clamp(1rem, 3vw, 1.25rem);
      color: var(--muted);
    }
  </style>
</head>
<body>
  <h1>안녕하세요, <span class="accent">[스윗밸런스 테스트 페이지]</span>입니다</h1>
  <p id="today">오늘 날짜를 불러오는 중…</p>

  <script>
    (function () {
      var now = new Date();
      var text = new Intl.DateTimeFormat("ko-KR", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long"
      }).format(now);
      var el = document.getElementById("today");
      el.textContent = "오늘은 " + text + "입니다.";
      el.setAttribute("datetime", now.toISOString().slice(0, 10));
    })();
  </script>
</body>
</html>
